<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Audio</title>
<meta property="og:image" content="/share.png">
<link rel="icon" href="/favicon.png">
<style>
  @font-face { font-family: AcmeSans; src: url(/acme.woff2) format("woff2"); }
  body { margin: 0; background: #f5f5f5; color: #111; font: 16px AcmeSans, sans-serif; }
  header { display: flex; justify-content: space-between; padding: 16px; background: #fff; }
  .hero { height: 400px; background: url(/hero-bg.png) center / cover; padding: 40px; }
  .btn { display: inline-block; padding: 12px 20px; border-radius: 8px; font-weight: 600; text-decoration: none; }
  .primary { background: #111; color: #fff; }
  .secondary { border: 2px solid #111; color: #111; }
  .cards { display: flex; gap: 16px; padding: 24px; }
  .card { width: 220px; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .card img { width: 100%; height: 120px; object-fit: cover; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; background: #ffd400; font-size: 12px; }
  input { padding: 12px; border: 1px solid #999; border-radius: 6px; }
  .icon { width: 20px; height: 20px; }
  .tall { height: 1400px; }
</style>
</head>
<body>
<header>
  <a href="/"><img src="/logo.svg" alt="Acme logo" width="100" height="24"></a>
  <nav><a href="/about.html">About</a> <a href="/products/one.html">Products</a></nav>
</header>
<section class="hero">
  <h1>Hear everything</h1>
  <a class="btn primary" href="#buy">Buy now</a>
  <a class="btn secondary" href="#more">Learn more</a>
  <span class="badge">New</span>
</section>
<section class="cards">
  <article class="card"><img src="/one.png" srcset="/one.png 400w, /one@2x.png 800w" alt="One"><h3>One</h3><svg class="icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/></svg></article>
  <article class="card"><img src="/two.png" alt="Two"><h3>Two</h3><svg class="icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/></svg></article>
  <article class="card"><img src="/three.png" alt="Three"><h3>Three</h3><img class="icon" src="/star.svg" alt="star"></article>
</section>
<div class="tall"></div>
<video src="/clip.mp4" poster="/poster.png" width="320" height="180" muted></video>
<form><input type="email" placeholder="Email address"> <button class="btn primary" type="submit">Sign up</button></form>
<footer><a href="/about.html">About</a> <a href="/privacy.html">Privacy</a></footer>
</body>
</html>
